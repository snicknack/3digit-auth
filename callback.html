<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>AuthSYS · Signing in</title>
<!--
  Served at https://auth.3digit.co.uk/callback (GitHub Pages serves callback.html there with no redirect,
  so the query string reaches this page intact).

  Shopify only returns a signed-in customer to an HTTPS address. This page passes Shopify's
  answer (a one-time code and the sign-in's state) straight on to AuthSYS, which is
  listening on this computer at 127.0.0.1:52847. Nothing is stored or sent anywhere else.

  The code is useless on its own: exchanging it needs the PKCE verifier, which never leaves
  the app. The app also rejects any answer whose state it did not generate.
-->
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #15171a; color: #e3e6ea; text-align: center; padding: 16px; box-sizing: border-box;
         font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  svg { display: block; margin: 0 auto 18px; }
  h1 { font-size: 20px; letter-spacing: .08em; color: #4c8dff; margin: 0 0 8px; }
  p { color: #8f97a1; max-width: 340px; margin: 8px auto 0; }
  a { color: #4c8dff; }
</style>
</head>
<body>
<div>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 230" width="72" height="72" aria-hidden="true"><rect x="8" y="8" width="214" height="214" rx="50" fill="none" stroke="#4C8DFF" stroke-width="16"/><defs><mask id="lockhole6935" maskUnits="userSpaceOnUse" x="0" y="0" width="230" height="230"><rect x="58" y="100" width="114" height="86" rx="18" fill="#fff"/><circle cx="115" cy="134" r="12" fill="#000"/><rect x="109" y="134" width="12" height="28" rx="5" fill="#000"/></mask></defs><path d="M84 104V84A31 31 0 0 1 146 84V104" fill="none" stroke="#E8EAED" stroke-width="16"/><rect x="50" y="90" width="130" height="100" fill="#E8EAED" mask="url(#lockhole6935)"/></svg>
  <h1>RETURNING TO AUTHSYS</h1>
  <p id="message">Passing your sign-in back to AuthSYS&hellip;</p>
  <p><a id="continue" href="#" hidden>Continue</a></p>
</div>
<script>
  (function () {
    var query = window.location.search;
    var message = document.getElementById("message");
    if (!/[?&]state=/.test(query)) {
      message.textContent = "This page is only used while signing in to AuthSYS. Open the app and press SIGN IN.";
      return;
    }
    var target = "http://127.0.0.1:52847/callback" + query;
    var link = document.getElementById("continue");
    link.href = target;
    link.hidden = false;
    window.location.replace(target);
    setTimeout(function () {
      message.textContent = "If nothing happened, make sure AuthSYS is still open, then press Continue.";
    }, 2500);
  })();
</script>
</body>
</html>
