<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>3DIGIT Authoriser</title>
<!--
  Served at https://auth.3digit.co.uk/callback (GitHub Pages serves callback.html there with no redirect,
  so the query string reaches this page intact).

  Shopify only returns a signed-in customer to an HTTPS address. This page passes Shopify's
  answer (a one-time code and the sign-in's state) straight on to the Authoriser, which is
  listening on this computer at 127.0.0.1:52847. Nothing is stored or sent anywhere else.

  The code is useless on its own: exchanging it needs the PKCE verifier, which never leaves
  the app. The app also rejects any answer whose state it did not generate.
-->
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #15171a; color: #e3e6ea; text-align: center; padding: 16px; box-sizing: border-box;
         font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { font-size: 20px; letter-spacing: .08em; color: #35d0c6; margin: 0 0 8px; }
  p { color: #8f97a1; max-width: 340px; margin: 8px auto 0; }
  a { color: #35d0c6; }
</style>
</head>
<body>
<div>
  <h1>RETURNING TO THE APP</h1>
  <p id="message">Passing your sign-in back to 3DIGIT Authoriser&hellip;</p>
  <p><a id="continue" href="#" hidden>Continue</a></p>
</div>
<script>
  (function () {
    var query = window.location.search;
    var message = document.getElementById("message");
    if (!/[?&]state=/.test(query)) {
      message.textContent = "This page is only used while signing in to 3DIGIT Authoriser. Open the app and press SIGN IN.";
      return;
    }
    var target = "http://127.0.0.1:52847/callback" + query;
    var link = document.getElementById("continue");
    link.href = target;
    link.hidden = false;
    window.location.replace(target);
    setTimeout(function () {
      message.textContent = "If nothing happened, make sure 3DIGIT Authoriser is still open, then press Continue.";
    }, 2500);
  })();
</script>
</body>
</html>
